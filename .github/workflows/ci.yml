name: CitriFood CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
concurrency:
  group: citrifood-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
