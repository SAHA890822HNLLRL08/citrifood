name: CitriFood CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
concurrency:
  group: citrifood-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - name: Build and capture errors
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Smoke test built server and private API boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat server.log
            exit 1
          fi
          npm run smoke:pilot -- http://127.0.0.1:3000
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citrifood-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
